# Mosquitto Configuration for GuardIOn Development
# This config allows anonymous connections for local testing

# Allow anonymous clients (no username/password required)
allow_anonymous true

# Listen on all interfaces
listener 1883 0.0.0.0

# Disable persistence (optional, for faster startup in dev)
persistence false

# Log settings
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection messages
connection_messages true
