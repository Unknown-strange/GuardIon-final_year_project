# Railway config — set service Root Directory to backend_guardion in the dashboard.
# Docs: https://docs.railway.com/guides/config-as-code

[build]
builder = "RAILPACK"
buildCommand = "python -m pip install --upgrade pip && python -m pip install -r requirements.txt"

[deploy]
startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
